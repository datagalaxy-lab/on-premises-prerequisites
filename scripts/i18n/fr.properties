# 1.verify-permissions.bash
permissions.usage=Usage : DG_NAMESPACE=<espace-de-nom> %s\n\nVérifie que le compte courant peut créer les ressources nécessaires à DataGalaxy.\n\nVariables d'environnement :\n  DG_NAMESPACE  Espace de nom dédié à DataGalaxy (obligatoire)\n  DG_LANG       Langue des messages, fr ou en (défaut : selon la locale)
permissions.title=Compte technique
permissions.can_create=create %s
permissions.user=Utilisateur : %s
permissions.namespaced=Ressources dans l'espace de nom %s
permissions.cluster=Ressources globales

# 2.verify-storage.bash
storage.usage=Usage : DG_NAMESPACE=<espace-de-nom> [DG_STORAGE_SIZE=<taille>] [DG_STORAGE_CLASS=<classe>] %s\n\nVérifie la création dynamique d'un volume persistant via un PVC.\nLes ressources créées sont supprimées à la fin du test.\n\nVariables d'environnement :\n  DG_NAMESPACE      Espace de nom dédié à DataGalaxy (obligatoire)\n  DG_STORAGE_SIZE   Taille du volume à tester (défaut : 1Gi). Relancer avec une autre taille, ex : 2Gi\n  DG_STORAGE_CLASS  Classe de stockage (défaut : celle par défaut du cluster)\n  DG_IMAGE          Image du POD de test (défaut : %s), à préfixer par le dépôt interne si besoin\n  DG_TIMEOUT        Délai d'attente maximal par étape, en secondes (défaut : 120)\n  DG_LANG           Langue des messages, fr ou en (défaut : selon la locale)
storage.title=Stockage
storage.classes=Classes de stockage disponibles :
storage.class_missing=La classe de stockage '%s' n'existe pas.
storage.no_default_class=Aucune classe de stockage par défaut. Préciser une classe avec l'option -c.
storage.existing_pvc=L'espace de nom %s contient déjà des PVC :
storage.test_title=Test avec un volume de %s
storage.pv_exists=Un volume persistant est déjà associé à %s. Test interrompu.
storage.create_failed=Création du PVC et du POD de test impossible.
storage.bound=Le PVC est dans l'état Bound.
storage.not_bound=Le PVC n'est pas passé dans l'état Bound en %ss.
storage.size_ok=Volume persistant %s créé avec la taille demandée (%s), classe '%s'.
storage.size_diff=Volume persistant %s créé avec une taille de %s au lieu de %s, classe '%s'.
storage.hostpath=Le volume est de type hostPath, ce qui est vivement déconseillé.
storage.writable=Le volume est monté et accessible en écriture dans un POD.
storage.not_writable=Le POD de test n'a pas pu écrire sur le volume (vérifier l'image et la prise en charge de fsGroup par le pilote).
storage.pv_deleted=Le volume persistant %s a été supprimé avec le PVC.
storage.pv_still_there=Le volume persistant %s existe toujours %ss après la suppression du PVC.
storage.pv_retained=Le volume persistant %s est conservé (reclaimPolicy=%s). L'exploitant doit justifier ce choix.
storage.pv_delete_hint=Pour le supprimer : kubectl delete pv %s

# 3.verify-ingress.bash
ingress.usage=Usage : DG_NAMESPACE=<espace-de-nom> DG_DOMAIN=<domaine> %s\n\nVérifie la présence et la configuration du contrôleur d'ingress.\nLes requêtes HTTP et HTTPS partent de la machine qui exécute ce script :\nelle ne doit pas faire partie du cluster Kubernetes.\n\nVariables d'environnement :\n  DG_NAMESPACE      Espace de nom dédié à DataGalaxy (obligatoire)\n  DG_DOMAIN         Nom de domaine prévu pour DataGalaxy, ex : datagalaxy.client.com (obligatoire)\n  DG_IMAGE          Image du serveur web (défaut : %s), à préfixer par le dépôt interne si besoin\n  DG_INGRESS_CLASS  Classe d'ingress (défaut : celle par défaut du cluster)\n  DG_INGRESS_IP     Adresse IP du contrôleur d'ingress, si le DNS n'est pas encore en place\n  DG_TIMEOUT        Délai d'attente maximal du déploiement, en secondes (défaut : 120)\n  DG_KEEP           true pour conserver les ressources de test à la fin\n  DG_LANG           Langue des messages, fr ou en (défaut : selon la locale)
ingress.title=Contrôleur d'ingress
ingress.classes=Classes d'ingress :
ingress.class_missing=La classe d'ingress '%s' n'existe pas.
ingress.no_default_class=Aucune classe d'ingress par défaut. Le test risque d'échouer : préciser une classe avec l'option -c.
ingress.controller_pods=PODs susceptibles d'être le contrôleur d'ingress :
ingress.no_controller_pod=Aucun POD de contrôleur d'ingress reconnu. L'exploitant doit le désigner.
ingress.exposed_services=Services exposés hors du cluster (LoadBalancer, NodePort) :
ingress.describe_link=L'exploitant doit détailler la liaison entre le contrôleur et le réseau extérieur.
ingress.deploy_title=Déploiement de l'application de test
ingress.deploy_info=Domaine : %s, image : %s
ingress.deploy_failed=Déploiement de l'application de test impossible.
ingress.deployed=L'application de test est déployée.
ingress.not_ready=L'application de test n'est pas prête après %ss (vérifier l'accès à l'image %s).
ingress.kept=Les ressources de test seront conservées. Pour les supprimer : kubectl delete deployment,service,configmap,ingress %s -n %s
ingress.access_title=Accès depuis l'extérieur du cluster
ingress.resolved=Le domaine %s est résolu en %s.
ingress.http_ok=HTTP : %s affiche « %s ».
ingress.http_unexpected=HTTP : code %s mais contenu inattendu.
ingress.http_redirect=HTTP : redirection (code %s), sans doute vers HTTPS. Le port 80 est exposé.
ingress.http_failed=HTTP : échec (code %s). Acceptable si le trafic HTTP est interdit.
ingress.https_ok=HTTPS : %s affiche « %s ». Contrôleur d'ingress validé.
ingress.https_failed=HTTPS : échec (code %s). Le contrôleur d'ingress n'est pas validé.
