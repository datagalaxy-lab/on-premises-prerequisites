# English messages.
# Format: key=value. "%s" is replaced by the parameters, in order. "\n" is a line break.

# Common
common.error=ERROR
common.command_not_found=Command '%s' not found.
common.cluster_unreachable=Cannot reach the cluster with kubectl (check the current context).
common.context=kubectl context: %s
common.namespace=Namespace: %s
common.namespace_missing=Namespace '%s' does not exist (or is not visible).
common.manifest_not_found=Manifest not found: %s
common.summary=Summary
common.warnings=%s warning(s)
common.failures=%s failure(s)

# 1.verify-permissions.bash
permissions.usage=Usage: DG_NAMESPACE=<namespace> %s\n\nChecks the current account can create the resources DataGalaxy needs.\n\nEnvironment variables:\n  DG_NAMESPACE  Namespace dedicated to DataGalaxy (required)\n  DG_LANG       Message language, fr or en (default: from the locale)
permissions.title=Technical account
permissions.can_create=create %s
permissions.user=User: %s
permissions.namespaced=Resources in namespace %s
permissions.cluster=Cluster-wide resources

# 2.verify-storage.bash
storage.usage=Usage: DG_NAMESPACE=<namespace> [DG_STORAGE_SIZE=<size>] [DG_STORAGE_CLASS=<class>] %s\n\nChecks a persistent volume is dynamically provisioned through a PVC.\nThe created resources are deleted at the end of the test.\n\nEnvironment variables:\n  DG_NAMESPACE      Namespace dedicated to DataGalaxy (required)\n  DG_STORAGE_SIZE   Volume size to test (default: 1Gi). Run again with another size, e.g. 2Gi\n  DG_STORAGE_CLASS  Storage class (default: the cluster default class)\n  DG_IMAGE          Test POD image (default: %s), to prefix with the internal registry if needed\n  DG_TIMEOUT        Maximum wait per step, in seconds (default: 120)\n  DG_LANG           Message language, fr or en (default: from the locale)
storage.title=Storage
storage.classes=Available storage classes:
storage.class_missing=Storage class '%s' does not exist.
storage.no_default_class=No default storage class. Specify a class with the -c option.
storage.existing_pvc=Namespace %s already contains PVC:
storage.test_title=Test with a %s volume
storage.pv_exists=A persistent volume is already bound to %s. Test aborted.
storage.create_failed=Cannot create the test PVC and POD.
storage.bound=The PVC is Bound.
storage.not_bound=The PVC is not Bound after %ss.
storage.size_ok=Persistent volume %s created with the requested size (%s), class '%s'.
storage.size_diff=Persistent volume %s created with a size of %s instead of %s, class '%s'.
storage.hostpath=The volume is a hostPath one, which is strongly discouraged.
storage.writable=The volume is mounted and writable in a POD.
storage.not_writable=The test POD could not write on the volume (check the image and the driver supports fsGroup).
storage.pv_deleted=Persistent volume %s was deleted with the PVC.
storage.pv_still_there=Persistent volume %s still exists %ss after the PVC deletion.
storage.pv_retained=Persistent volume %s is kept (reclaimPolicy=%s). The operator must justify this choice.
storage.pv_delete_hint=To delete it: kubectl delete pv %s

# 3.verify-ingress.bash
ingress.usage=Usage: DG_NAMESPACE=<namespace> DG_DOMAIN=<domain> %s\n\nChecks an ingress controller is present and properly configured.\nHTTP and HTTPS requests are sent from the machine running this script:\nit must not be part of the Kubernetes cluster.\n\nEnvironment variables:\n  DG_NAMESPACE      Namespace dedicated to DataGalaxy (required)\n  DG_DOMAIN         Domain name planned for DataGalaxy, e.g. datagalaxy.client.com (required)\n  DG_IMAGE          Web server image (default: %s), to prefix with the internal registry if needed\n  DG_INGRESS_CLASS  Ingress class (default: the cluster default class)\n  DG_INGRESS_IP     Ingress controller IP address, when DNS is not set up yet\n  DG_TIMEOUT        Maximum wait for the deployment, in seconds (default: 120)\n  DG_KEEP           true to keep the test resources at the end\n  DG_LANG           Message language, fr or en (default: from the locale)
ingress.title=Ingress controller
ingress.classes=Ingress classes:
ingress.class_missing=Ingress class '%s' does not exist.
ingress.no_default_class=No default ingress class. The test may fail: specify a class with the -c option.
ingress.controller_pods=PODs likely to be the ingress controller:
ingress.no_controller_pod=No known ingress controller POD. The operator must point it out.
ingress.exposed_services=Services exposed outside the cluster (LoadBalancer, NodePort):
ingress.describe_link=The operator must describe how the controller is connected to the outside network.
ingress.deploy_title=Test application deployment
ingress.deploy_info=Domain: %s, image: %s
ingress.deploy_failed=Cannot deploy the test application.
ingress.deployed=The test application is deployed.
ingress.not_ready=The test application is not ready after %ss (check access to image %s).
ingress.kept=Test resources will be kept. To delete them: kubectl delete deployment,service,configmap,ingress %s -n %s
ingress.access_title=Access from outside the cluster
ingress.resolved=Domain %s is resolved to %s.
ingress.http_ok=HTTP: %s displays "%s".
ingress.http_unexpected=HTTP: code %s but unexpected content.
ingress.http_redirect=HTTP: redirect (code %s), probably to HTTPS. Port 80 is exposed.
ingress.http_failed=HTTP: failure (code %s). Acceptable if HTTP traffic is forbidden.
ingress.https_ok=HTTPS: %s displays "%s". Ingress controller validated.
ingress.https_failed=HTTPS: failure (code %s). The ingress controller is not validated.
