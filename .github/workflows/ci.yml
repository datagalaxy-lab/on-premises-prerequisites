name: CI

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*

env:
  KUBECONFORM_VERSION: v0.8.0
  # Keep in sync with the pre-commit hook revision.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run ShellCheck
      run: |
        docker run --rm -v "$PWD:/mnt" -w /mnt "koalaman/shellcheck:${SHELLCHECK_VERSION}" \
          -x scripts/*.bash scripts/lib/*.bash

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install kubeconform
      run: |
        curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
          | sudo tar xz -C /usr/local/bin kubeconform
    - name: Validate Kubernetes manifests
      run: kubeconform -strict -summary k8s_manifests/
